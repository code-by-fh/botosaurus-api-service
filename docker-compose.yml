services:
  page-render-service:
    build: .
    ports:
      # The only published port. The noVNC debug view (ENABLE_VNC=true) and the
      # API docs (ENABLE_DOCS=true) are served through it, behind authentication.
      - "8000:8000"
    env_file:
      - .env        # API_KEYS (required), HOME_PROXY, VNC_PASSWORD, ...
    environment:
      # Defaults only: a value in .env takes precedence. Values fixed here would
      # override env_file silently.
      # MAX_WORKERS is sized for a Hetzner CX33 (4 vCPU / 8 GB); use 2 on a CX23.
      MAX_WORKERS: "${MAX_WORKERS:-3}"
      HEADLESS: "${HEADLESS:-false}"
      ENABLE_VNC: "${ENABLE_VNC:-false}"
      ENABLE_DOCS: "${ENABLE_DOCS:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      # Chrome profiles, caches and the X11 socket live here. Chrome runs with
      # --disable-dev-shm-usage, so /tmp replaces /dev/shm and needs the room.
      - /tmp:size=1g,mode=1777
      - /home/app:size=256m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    cpus: "3.5"
    pids_limit: 2048
